<div id="resetModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
        <div class="p-8 border-b border-stone-100">
            <h3 class="text-2xl font-black text-stone-900">Reset Password User</h3>
            <p class="text-stone-500 text-sm mt-1">Set password baru untuk <span id="resetUserName" class="font-bold"></span></p>
        </div>
        <form method="POST" class="p-8 space-y-6">
            <input type="hidden" name="csrf_token" value="<?php echo $_SESSION['csrf_token']; ?>">
            <input type="hidden" name="reset_user_id" value="">
            <input type="hidden" name="reset_password_action" value="1">
            <div>
                <label class="block text-[10px] font-black text-stone-400 uppercase tracking-widest mb-3">Password Baru</label>
                <input type="password" name="new_password" required placeholder="••••••••" class="w-full bg-stone-50 border border-stone-200 rounded-2xl px-6 py-4 text-sm font-bold focus:outline-none focus:ring-4 focus:ring-emerald-500/10">
            </div>
            <div class="flex gap-3 pt-2">
                <button type="button" onclick="closeResetModal()" class="flex-1 bg-stone-50 text-stone-600 py-4 rounded-xl font-bold hover:bg-stone-100 transition-all">Batal</button>
                <button type="submit" class="flex-1 bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all shadow-lg">Reset Password</button>
            </div>
        </form>
    </div>
</div>

<script>
function resetPassword(userId) {
    fetchUserInfo(userId).then(userInfo => {
        document.getElementById('resetUserName').textContent = userInfo.name;
        document.querySelector('input[name="reset_user_id"]').value = userId;
        document.getElementById('resetModal').classList.remove('hidden');
    });
}

function closeResetModal() {
    document.getElementById('resetModal').classList.add('hidden');
    document.querySelector('input[name="reset_user_id"]').value = '';
}

function fetchUserInfo(userId) {
    return fetch(`?page=admin&ajax=user_info&id=${userId}`)
        .then(response => response.json())
        .then(data => ({ name: data.display_name }));
}
</script>
